modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''Compatibilidad VR (Vivecraft) para Just Enough Guns. Funciona solo en el cliente; instalado también en el servidor, las balas salen desde el arma.'''
# Optional on either side: never flag a version mismatch in the server list.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jeg"
mandatory=false
versionRange="[0.13,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="vivecraft"
mandatory=false
versionRange="[1.2,)"
ordering="AFTER"
side="BOTH"
