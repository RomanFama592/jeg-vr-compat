modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''VR support for Just Enough Guns through Vivecraft: guns follow your controllers, shots leave the barrel, and you reload by hand. Works on the client alone; also installed on the server, it adds shooting and reloading with either hand and bullets that start at the muzzle.'''
# Optional on either side: never flag a version mismatch in the server list.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jeg"
mandatory=false
versionRange="${jeg_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="vivecraft"
mandatory=false
versionRange="${vivecraft_version_range}"
ordering="AFTER"
side="BOTH"
