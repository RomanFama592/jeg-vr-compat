org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=jeg_vr_compat
mod_name=JEG x Vivecraft Compat
mod_version=0.1.1
mod_group=com.jegvr
mod_authors=Fama Roman
mod_license=GPL-3.0-or-later

minecraft_version=1.20.1
forge_version=47.2.0
# Versions we compile and test against, and the ones the addon accepts. A range is exactly what was tested: another
