org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=jeg_vr_compat
mod_name=JEG x Vivecraft Compat
mod_version=0.1.0
mod_group=com.jegvr
mod_authors=Fama Roman
# To confirm before the first release: see PUBLICACION.md
mod_license=MIT

minecraft_version=1.20.1
forge_version=47.2.0
# Versions we compile and test against, and the ones the addon accepts. A range is exactly what was tested: another
# version gets Forge's clear error screen instead of a crash in the middle of a game.
jeg_version=0.13.2-1.20.1
jeg_version_range=[0.13.2,0.14)
# Vivecraft's mod version carries the game's: 1.20.1-1.2.5.
vivecraft_version=1.20.1-1.2.5-forge
vivecraft_version_range=[1.20.1-1.2.5,1.20.1-1.3)
geckolib_version=4.4.4
framework_version=1.20.1-0.7.11
mixinextras_version=0.3.5
# Only for -Pcompat: the usual renderer and shader mods for Forge 1.20.1 (Modrinth version ids).
embeddium_version=UTbfe5d1
oculus_version=iQ1SwGc3
