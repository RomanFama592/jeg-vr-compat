org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=jeg_vr_compat
mod_name=JEG x Vivecraft Compat
mod_version=0.3.0-beta
mod_group=com.jegvr
mod_authors=Fama Roman
mod_license=GPL-3.0-or-later

minecraft_version=1.20.1
forge_version=47.2.0
# The addon supports two lines of JEG and of Vivecraft with one jar. `main` is compiled against the oldest of each
# (jeg_version, vivecraft_version); `./gradlew checkMatrix` compiles it against the newest too (the *_latest ones) and
# checks the mixins against all four combinations. Test runs use the oldest; -Platest, -PlatestJeg or
# -PlatestVivecraft run with the newest.
# A range is what was checked: another version gets Forge's clear error screen instead of a crash in the middle of a game.
jeg_version=0.13.2
jeg_version_latest=0.14.5
jeg_version_range=[0.13.2,0.15)
# Vivecraft's mod version carries the game's: 1.20.1-1.2.5.
vivecraft_version=1.20.1-1.2.5-forge
vivecraft_version_latest=1.20.1-1.3.15-forge
vivecraft_version_range=[1.20.1-1.2.5,1.20.1-1.4)
geckolib_version=4.4.4
# Framework is not on Modrinth: this is the CurseForge file id of framework-forge-1.20.1-0.7.12.jar.
framework_file_id=5911986
mixinextras_version=0.3.5
# Only for -Pcompat: the usual renderer and shader mods for Forge 1.20.1 (Modrinth version ids).
embeddium_version=UTbfe5d1
oculus_version=iQ1SwGc3
