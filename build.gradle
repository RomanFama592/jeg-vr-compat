plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = mod_group
version = mod_version

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.debug.export', 'true'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // ./gradlew runClient -Pzgc  -> run the game with the Z garbage collector.
            if (project.hasProperty('zgc')) {
                jvmArg '-XX:+UseZGC'
            }
        }
        // Second client for multiplayer tests (see MULTIJUGADOR.md): its own folder, name and Vivecraft settings
        // (starts with VR off), so it can run next to runClient. ./gradlew runClient2 [-PnoVivecraft]
        client2 {
            parent runs.client
            workingDirectory project.file('run-client2')
            args '--username', 'Flat'
        }
        // Applies every mixin of every mod, logs what fails and closes the game: ./gradlew runClientAudit [-Pcompat]
        // Its own folder, with VR off, so it never starts SteamVR.
        clientAudit {
            parent runs.client
            workingDirectory project.file('run-audit')
            property 'jegvr.audit', 'true'
        }
        // Dedicated server for phase S: ./gradlew runServer -PnoVivecraft (JEG + addon, no Vivecraft).
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }
    }
}

// Seed configs for the multiplayer setup, only when missing (never overwrite what the game or the user wrote).
def seedFile = { String path, String text ->
    def file = project.file(path)
    if (!file.exists()) {
        file.parentFile.mkdirs()
        file.text = text
    }
}
tasks.matching { it.name == 'runClient2' }.configureEach {
    doFirst { seedFile('run-client2/config/vivecraft-client-config.json', '{"vrEnabled": "false", "rememberVr": "true"}\n') }
}
tasks.matching { it.name == 'runClientAudit' }.configureEach {
    doFirst { seedFile('run-audit/config/vivecraft-client-config.json', '{"vrEnabled": "false", "rememberVr": "true"}\n') }
}
tasks.matching { it.name == 'runServer' }.configureEach {
    // Dev clients have no Mojang session, so the test server must not authenticate them.
    doFirst { seedFile('run-server/server.properties', 'online-mode=false\n') }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    flatDir { dirs 'libs' }
    // Only the test libraries: everything else keeps coming from where ForgeGradle resolves it.
    mavenCentral {
        content {
            includeGroup 'org.junit'
            includeGroup 'org.junit.jupiter'
            includeGroup 'org.junit.platform'
            includeGroup 'org.opentest4j'
            includeGroup 'org.apiguardian'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Only compat/vivecraft/VivecraftBridge and the mixins may import org.vivecraft.* (Vivecraft is optional at runtime).
    compileOnly fg.deobf("maven.modrinth:vivecraft:${vivecraft_version}")
    // ./gradlew runClient -PnoVivecraft  -> test the flat path without Vivecraft installed
    if (!project.hasProperty('noVivecraft')) {
        runtimeOnly fg.deobf("maven.modrinth:vivecraft:${vivecraft_version}")
    }
    // ./gradlew runClient -Pcompat  -> with Embeddium and Oculus (see COMPATIBILIDAD.md)
    if (project.hasProperty('compat')) {
        runtimeOnly fg.deobf("maven.modrinth:embeddium:${embeddium_version}")
        runtimeOnly fg.deobf("maven.modrinth:oculus:${oculus_version}")
    }
    compileOnly fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
    compileOnly fg.deobf("local:JustEnoughGuns:${jeg_version}")
    compileOnly fg.deobf("local:framework-forge:${framework_version}")

    runtimeOnly fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
    runtimeOnly fg.deobf("local:JustEnoughGuns:${jeg_version}")
    runtimeOnly fg.deobf("local:framework-forge:${framework_version}")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
        jarJar.ranged(it, "[${mixinextras_version},)")
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_authors: mod_authors,
                             mod_license: mod_license, jeg_version_range: jeg_version_range,
                             vivecraft_version_range: vivecraft_version_range]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title'  : mod_id,
        'Implementation-Title' : mod_name,
        'Implementation-Version': mod_version
    ])
    // The jar that gets published is the jarJar one, which carries MixinExtras: this one only feeds it.
    archiveClassifier = 'slim'
    finalizedBy 'reobfJar'
}

tasks.named('jarJar').configure {
    archiveClassifier = ''
    manifest.attributes([
        'Specification-Title'  : mod_id,
        'Implementation-Title' : mod_name,
        'Implementation-Version': mod_version
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
