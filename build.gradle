plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}

group = mod_group
version = mod_version

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// One jar for two lines of JEG and of Vivecraft (see gradle.properties). What only exists in one line of Vivecraft is in
// its own source set, compiled against that line: src/vc12 (1.2.x) and src/vc13 (1.3.x). compat/Versions picks at runtime.
sourceSets {
    vc12
    vc13
}
def vivecraftSets = [sourceSets.vc12, sourceSets.vc13]

// The versions of this build: `main` is compiled against them and the test runs use them. The oldest supported ones,
// which is what the published jar is built with, or the newest with -Platest / -PlatestJeg / -PlatestVivecraft.
def devJegVersion = (project.hasProperty('latest') || project.hasProperty('latestJeg')) ? jeg_version_latest : jeg_version
def devVivecraftVersion = (project.hasProperty('latest') || project.hasProperty('latestVivecraft')) ? vivecraft_version_latest : vivecraft_version
// ForgeGradle deobfuscates one version of a mod per build (two would meet in its one configuration of originals, where
// the newest wins and the other is "not found"). So the other version is compiled against as published: its own names
// and the game's class names are the same there, which is all the compiler needs from it.
def jegDependency = { String version ->
    def notation = "maven.modrinth:just-enough-guns:${version}"
    version == devJegVersion ? fg.deobf(notation) : dependencies.create(notation) { transitive = false }
}
def vivecraftDependency = { String version ->
    def notation = "maven.modrinth:vivecraft:${version}"
    version == devVivecraftVersion ? fg.deobf(notation) : dependencies.create(notation) { transitive = false }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.debug.export', 'true'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.vc12
                    source sourceSets.vc13
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // ./gradlew runClient -Pzgc  -> run the game with the Z garbage collector.
            if (project.hasProperty('zgc')) {
                jvmArg '-XX:+UseZGC'
            }
        }
        // Second client for multiplayer tests (see docs/MULTIJUGADOR.md): its own folder, name and Vivecraft settings
        // (starts with VR off), so it can run next to runClient. ./gradlew runClient2 [-PnoVivecraft]
        client2 {
            parent runs.client
            workingDirectory project.file('run-client2')
            args '--username', 'Flat'
        }
        // Applies every mixin of every mod, logs what fails and closes the game: ./gradlew runClientAudit [-Pcompat]
        // Its own folder, with VR off, so it never starts SteamVR.
        clientAudit {
            parent runs.client
            workingDirectory project.file('run-audit')
            property 'jegvr.audit', 'true'
        }
        // Dedicated server for phase S: ./gradlew runServer -PnoVivecraft (JEG + addon, no Vivecraft).
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }
    }
}

// Seed configs for the multiplayer setup, only when missing (never overwrite what the game or the user wrote).
def seedFile = { String path, String text ->
    def file = project.file(path)
    if (!file.exists()) {
        file.parentFile.mkdirs()
        file.text = text
    }
}
tasks.matching { it.name == 'runClient2' }.configureEach {
    doFirst { seedFile('run-client2/config/vivecraft-client-config.json', '{"vrEnabled": "false", "rememberVr": "true"}\n') }
}
tasks.matching { it.name == 'runClientAudit' }.configureEach {
    doFirst { seedFile('run-audit/config/vivecraft-client-config.json', '{"vrEnabled": "false", "rememberVr": "true"}\n') }
}
tasks.matching { it.name == 'runServer' }.configureEach {
    // Dev clients have no Mojang session, so the test server must not authenticate them.
    doFirst { seedFile('run-server/server.properties', 'online-mode=false\n') }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Only the test libraries: everything else keeps coming from where ForgeGradle resolves it.
    mavenCentral {
        content {
            includeGroup 'org.junit'
            includeGroup 'org.junit.jupiter'
            includeGroup 'org.junit.platform'
            includeGroup 'org.opentest4j'
            includeGroup 'org.apiguardian'
        }
    }
}

configurations {
    // What every source set compiles against besides Minecraft, JEG and a Vivecraft.
    sharedMods
    compileOnly.extendsFrom sharedMods
    vc12CompileOnly.extendsFrom sharedMods
    vc13CompileOnly.extendsFrom sharedMods
    vc12Implementation.extendsFrom minecraft
    vc13Implementation.extendsFrom minecraft
}

// Every supported combination, for checkMatrix: [name, JEG, Vivecraft, the source set with that Vivecraft's own code].
def combos = [
    ['OldJegOldVivecraft', jeg_version,        vivecraft_version,        'vc12'],
    ['OldJegNewVivecraft', jeg_version,        vivecraft_version_latest, 'vc13'],
    ['NewJegOldVivecraft', jeg_version_latest, vivecraft_version,        'vc12'],
    ['NewJegNewVivecraft', jeg_version_latest, vivecraft_version_latest, 'vc13'],
]

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Only compat/vivecraft and the mixins may import org.vivecraft.* (Vivecraft is optional at runtime).
    compileOnly vivecraftDependency(devVivecraftVersion)
    vc12CompileOnly vivecraftDependency(vivecraft_version)
    vc13CompileOnly vivecraftDependency(vivecraft_version_latest)
    vivecraftSets.each { set ->
        add(set.compileOnlyConfigurationName, sourceSets.main.output)
        add(set.compileOnlyConfigurationName, jegDependency(devJegVersion))
    }
    // ./gradlew runClient -PnoVivecraft  -> test the flat path without Vivecraft installed
    if (!project.hasProperty('noVivecraft')) {
        runtimeOnly fg.deobf("maven.modrinth:vivecraft:${devVivecraftVersion}")
    }
    // ./gradlew runClient -Pcompat  -> with Embeddium and Oculus (see docs/COMPATIBILIDAD.md)
    if (project.hasProperty('compat')) {
        runtimeOnly fg.deobf("maven.modrinth:embeddium:${embeddium_version}")
        runtimeOnly fg.deobf("maven.modrinth:oculus:${oculus_version}")
    }
    sharedMods fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
    sharedMods fg.deobf("curse.maven:framework-549225:${framework_file_id}")
    sharedMods "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    compileOnly jegDependency(devJegVersion)

    runtimeOnly fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
    runtimeOnly fg.deobf("maven.modrinth:just-enough-guns:${devJegVersion}")
    runtimeOnly fg.deobf("curse.maven:framework-549225:${framework_file_id}")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
        jarJar.ranged(it, "[${mixinextras_version},)")
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    combos.each { combo ->
        def (name, jeg, vivecraft) = combo
        // The jars as players have them, for checkMixins: not deobfuscated.
        def original = configurations.create("originalMods${name}") { transitive = false }
        add(original.name, "maven.modrinth:just-enough-guns:${jeg}")
        add(original.name, "maven.modrinth:vivecraft:${vivecraft}")
        add(original.name, "software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
        add(original.name, "curse.maven:framework-549225:${framework_file_id}")
        // What `main` is compiled against in this combination.
        def matrix = configurations.create("matrix${name}") { extendsFrom configurations.sharedMods, configurations.minecraft }
        add(matrix.name, jegDependency(jeg))
        add(matrix.name, vivecraftDependency(vivecraft))
    }
}

// ./gradlew checkMixins -> looks the names our remap=false mixins use up in the jars players have, for every supported
// combination of JEG and Vivecraft (see tools/check_mixins.py). Needs Python.
def python = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'python' : 'python3'
def checkMixins = tasks.register('checkMixins') {
    group = 'verification'
    description = 'Checks mixin names against the original jars of every supported JEG and Vivecraft.'
}
// ./gradlew checkMatrix -> compiles everything against every supported combination, then checkMixins.
def checkMatrix = tasks.register('checkMatrix') {
    group = 'verification'
    description = 'Compiles against every supported combination of JEG and Vivecraft and checks the mixin names.'
    dependsOn 'compileJava', 'compileVc12Java', 'compileVc13Java', checkMixins
}
combos.each { combo ->
    def (name, jeg, vivecraft, vivecraftSet) = combo
    def check = tasks.register("checkMixins${name}", Exec) {
        group = 'verification'
        description = "Mixin names against JEG ${jeg} and Vivecraft ${vivecraft}."
        def compiler = javaToolchains.compilerFor(java.toolchain)
        doFirst {
            commandLine python, 'tools/check_mixins.py',
                    compiler.get().metadata.installationPath.file('bin/javap').asFile.path,
                    configurations["originalMods${name}"].asPath,
                    'src/main/java/com/jegvr/mixin', "src/${vivecraftSet}/java/com/jegvr/mixin"
        }
    }
    checkMixins.configure { dependsOn check }
    if (jeg != devJegVersion || vivecraft != devVivecraftVersion) {
        // compileJava is this build's own combination. The others only have to compile: no mixin processor.
        def compile = tasks.register("compileMatrix${name}", JavaCompile) {
            group = 'verification'
            description = "Compiles main against JEG ${jeg} and Vivecraft ${vivecraft}."
            source = sourceSets.main.java
            classpath = configurations["matrix${name}"]
            destinationDirectory = layout.buildDirectory.dir("matrix/${name}")
            options.compilerArgs << '-proc:none'
        }
        checkMatrix.configure { dependsOn compile }
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_authors: mod_authors,
                             mod_license: mod_license, jeg_version_range: jeg_version_range,
                             vivecraft_version_range: vivecraft_version_range]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title'  : mod_id,
        'Implementation-Title' : mod_name,
        'Implementation-Version': mod_version
    ])
    // The jar that gets published is the jarJar one, which carries MixinExtras: this one only feeds it.
    archiveClassifier = 'slim'
    from('LICENSE')
    vivecraftSets.each { from it.output }
    finalizedBy 'reobfJar'
}

tasks.named('jarJar').configure {
    archiveClassifier = ''
    from('LICENSE')
    vivecraftSets.each { from it.output }
    manifest.attributes([
        'Specification-Title'  : mod_id,
        'Implementation-Title' : mod_name,
        'Implementation-Version': mod_version
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
