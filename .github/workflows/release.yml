# Publishes a version when a tag like v0.1.1 is pushed: CurseForge (alpha by default) and a GitHub release.
# Needs the CURSEFORGE_TOKEN secret and the CURSEFORGE_PROJECT_ID variable (see docs/PUBLICAR.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches mod_version
        id: meta
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Release type from the version: 0.x is alpha unless it says beta; 1.x and later are releases.
          case "$version" in
            *beta*) echo "type=beta" >> "$GITHUB_OUTPUT" ;;
            0.*|*alpha*) echo "type=alpha" >> "$GITHUB_OUTPUT" ;;
            *) echo "type=release" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Changelog of this version
        run: |
          awk -v v="${{ steps.meta.outputs.version }}" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## ${{ steps.meta.outputs.version }}' section"
            exit 1
          fi
          if grep -q "^## ${{ steps.meta.outputs.version }} (unreleased)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md still says (unreleased) for this version"
            exit 1
          fi

      - name: Build and test
        run: ./gradlew build test

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/!(*-@(slim|sources|javadoc)).jar
          name: Just Enough Guns VR ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.type }}
          changelog-file: release-notes.md
          loaders: forge
          game-versions: 1.20.1
          java: 17
          dependencies: |
            just-enough-guns(required)
            vivecraft(required)
