# Builds and runs the unit tests on every push and pull request. The jar is kept as an artifact for testing.
name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew build test
      # Compiles against every supported combination of JEG and Vivecraft and checks the mixin names in their jars.
      - name: Check every supported version
        run: ./gradlew checkMatrix
      - uses: actions/upload-artifact@v5
        with:
          name: jeg_vr_compat-${{ github.sha }}
          # The published jar is the jarJar one; the -slim jar lacks MixinExtras.
          path: |
            build/libs/*.jar
            !build/libs/*-slim.jar
            !build/libs/*-sources.jar
